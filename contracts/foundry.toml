[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.28"
# Robinhood Chain is an Arbitrum Orbit chain (Nitro). Cancun opcodes are supported since ArbOS 20.
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = false
bytecode_hash = "none"
cbor_metadata = false
fs_permissions = [{ access = "read-write", path = "./deployments" }]
remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "forge-std/=lib/forge-std/src/",
]

[profile.default.fuzz]
runs = 512

[profile.ci.fuzz]
runs = 4096

[rpc_endpoints]
robinhood = "${ROBINHOOD_RPC_URL}"
local = "http://127.0.0.1:8545"

[etherscan]
# Robinhood Chain explorer is Blockscout; verification uses `--verifier blockscout`.
robinhood = { key = "${BLOCKSCOUT_API_KEY}", url = "https://robinhoodchain.blockscout.com/api/", chain = 4663 }

[fmt]
line_length = 110
tab_width = 4
bracket_spacing = false

[lint]
# Public immutables keep their readable ABI names (e.g. `launchpad()`, `graduationEth()`), which the
# frontend and indexer call directly. Hashing is not on a gas-critical path.
exclude_lints = ["screaming-snake-case-immutable", "asm-keccak256", "mixed-case-function", "unsafe-cheatcode"]
ignore = ["test/**/*.sol"]
